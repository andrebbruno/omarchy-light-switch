[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "omarchy-light-switch"
version = "0.1.0"
description = "Light Switch for Omarchy: a light theme by day and a dark one at night, by the clock or by the sun."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Andre Bruno" }]
keywords = ["omarchy", "powertoys", "theme", "dark-mode", "sunrise", "hyprland"]
classifiers = [
  "Environment :: X11 Applications",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Desktop Environment",
]
dependencies = []

[project.scripts]
omarchy-light-switch = "olightswitch.cli:main"

[project.urls]
Homepage = "https://github.com/andrebbruno/omarchy-light-switch"

[tool.setuptools.packages.find]
include = ["olightswitch*"]
